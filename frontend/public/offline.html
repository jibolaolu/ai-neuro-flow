<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Neuro Flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      color: #0f172a;
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1d4ed8, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(29,78,216,0.25);
    }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; text-align: center; }
    p { color: #64748b; font-size: 0.9rem; text-align: center; max-width: 320px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      background: #1d4ed8; color: #fff; border: none;
      padding: 14px 28px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      min-height: 48px; min-width: 180px;
    }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .cached-note {
      margin-top: 24px; font-size: 0.75rem; color: #94a3b8; text-align: center;
    }
  </style>
</head>
<body>
  <div class="icon">🧠</div>
  <h1>You're offline</h1>
  <p>No internet connection right now. Previously viewed pages and client data may still be available below.</p>
  <button class="btn" onclick="window.location.reload()">Try again</button>
  <p class="cached-note">Neuro Flow caches your recent data — try navigating to a page you've visited.</p>
</body>
</html>

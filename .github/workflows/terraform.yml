name: Terraform — Plan & Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

env:
  TF_VERSION: "1.14.8"   # >= 1.10 required for S3 native state locking
  AWS_REGION: eu-west-2

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ── Resolve parameters ────────────────────────────────────────────────────────
  resolve:
    name: Resolve parameters
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.params.outputs.environment }}
      action:      ${{ steps.params.outputs.action }}
      tf_dir:      ${{ steps.params.outputs.tf_dir }}

    steps:
      - name: Set parameters
        id: params
        run: |
          ENV="${{ github.event.inputs.environment }}"
          ACTION="${{ github.event.inputs.action }}"
          echo "environment=${ENV}"  >> $GITHUB_OUTPUT
          echo "action=${ACTION}"    >> $GITHUB_OUTPUT
          echo "tf_dir=terraform/environments/${ENV}" >> $GITHUB_OUTPUT

  # ── Terraform plan ────────────────────────────────────────────────────────────
  plan:
    name: Terraform plan (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve
    environment: ${{ needs.resolve.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set environment secrets
        run: |
          if [ "${{ needs.resolve.outputs.environment }}" = "prod" ]; then
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}"             >> $GITHUB_ENV
            echo "TF_VAR_jwt_secret=${{ secrets.PROD_JWT_SECRET }}"               >> $GITHUB_ENV
            echo "TF_VAR_stripe_secret_key=${{ secrets.PROD_STRIPE_SECRET_KEY }}" >> $GITHUB_ENV
            echo "TF_VAR_stripe_webhook_secret=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_secret=${{ secrets.PROD_AUTH0_SECRET }}"                   >> $GITHUB_ENV
            echo "TF_VAR_auth0_issuer_base_url=${{ secrets.PROD_AUTH0_ISSUER_BASE_URL }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_id=${{ secrets.PROD_AUTH0_CLIENT_ID }}"             >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_secret=${{ secrets.PROD_AUTH0_CLIENT_SECRET }}"     >> $GITHUB_ENV
            echo "TF_VAR_auth0_audience=${{ secrets.PROD_AUTH0_AUDIENCE }}"               >> $GITHUB_ENV
          else
            echo "TF_VAR_db_password=${{ secrets.DEV_DB_PASSWORD }}"              >> $GITHUB_ENV
            echo "TF_VAR_jwt_secret=${{ secrets.DEV_JWT_SECRET }}"                >> $GITHUB_ENV
            echo "TF_VAR_stripe_secret_key=${{ secrets.DEV_STRIPE_SECRET_KEY }}"  >> $GITHUB_ENV
            echo "TF_VAR_stripe_webhook_secret=${{ secrets.DEV_STRIPE_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_secret=${{ secrets.DEV_AUTH0_SECRET }}"                   >> $GITHUB_ENV
            echo "TF_VAR_auth0_issuer_base_url=${{ secrets.DEV_AUTH0_ISSUER_BASE_URL }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_id=${{ secrets.DEV_AUTH0_CLIENT_ID }}"             >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_secret=${{ secrets.DEV_AUTH0_CLIENT_SECRET }}"     >> $GITHUB_ENV
            echo "TF_VAR_auth0_audience=${{ secrets.DEV_AUTH0_AUDIENCE }}"               >> $GITHUB_ENV
          fi

      - name: Terraform fmt check
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        env:
          TF_VAR_anthropic_api_key:         ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_sendgrid_api_key:           ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_stripe_price_starter:       ${{ secrets.STRIPE_PRICE_STARTER }}
          TF_VAR_stripe_price_professional:  ${{ secrets.STRIPE_PRICE_PROFESSIONAL }}
          TF_VAR_stripe_price_enterprise:    ${{ secrets.STRIPE_PRICE_ENTERPRISE }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "PLAN_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.resolve.outputs.environment }}
          path: |
            ${{ needs.resolve.outputs.tf_dir }}/tfplan
            ${{ needs.resolve.outputs.tf_dir }}/plan.txt
          retention-days: 1

      - name: Summary
        run: |
          echo "## Terraform Plan — ${{ needs.resolve.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 ${{ needs.resolve.outputs.tf_dir }}/plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Terraform apply ───────────────────────────────────────────────────────────
  apply:
    name: Terraform apply (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve, plan]
    if: needs.resolve.outputs.action == 'apply'
    environment: ${{ needs.resolve.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set environment secrets
        run: |
          if [ "${{ needs.resolve.outputs.environment }}" = "prod" ]; then
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}"             >> $GITHUB_ENV
            echo "TF_VAR_jwt_secret=${{ secrets.PROD_JWT_SECRET }}"               >> $GITHUB_ENV
            echo "TF_VAR_stripe_secret_key=${{ secrets.PROD_STRIPE_SECRET_KEY }}" >> $GITHUB_ENV
            echo "TF_VAR_stripe_webhook_secret=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_secret=${{ secrets.PROD_AUTH0_SECRET }}"                   >> $GITHUB_ENV
            echo "TF_VAR_auth0_issuer_base_url=${{ secrets.PROD_AUTH0_ISSUER_BASE_URL }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_id=${{ secrets.PROD_AUTH0_CLIENT_ID }}"             >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_secret=${{ secrets.PROD_AUTH0_CLIENT_SECRET }}"     >> $GITHUB_ENV
            echo "TF_VAR_auth0_audience=${{ secrets.PROD_AUTH0_AUDIENCE }}"               >> $GITHUB_ENV
          else
            echo "TF_VAR_db_password=${{ secrets.DEV_DB_PASSWORD }}"              >> $GITHUB_ENV
            echo "TF_VAR_jwt_secret=${{ secrets.DEV_JWT_SECRET }}"                >> $GITHUB_ENV
            echo "TF_VAR_stripe_secret_key=${{ secrets.DEV_STRIPE_SECRET_KEY }}"  >> $GITHUB_ENV
            echo "TF_VAR_stripe_webhook_secret=${{ secrets.DEV_STRIPE_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_secret=${{ secrets.DEV_AUTH0_SECRET }}"                   >> $GITHUB_ENV
            echo "TF_VAR_auth0_issuer_base_url=${{ secrets.DEV_AUTH0_ISSUER_BASE_URL }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_id=${{ secrets.DEV_AUTH0_CLIENT_ID }}"             >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_secret=${{ secrets.DEV_AUTH0_CLIENT_SECRET }}"     >> $GITHUB_ENV
            echo "TF_VAR_auth0_audience=${{ secrets.DEV_AUTH0_AUDIENCE }}"               >> $GITHUB_ENV
          fi

      - name: Terraform init
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        run: terraform init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.resolve.outputs.environment }}
          path: ${{ needs.resolve.outputs.tf_dir }}

      - name: Terraform apply
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        env:
          TF_VAR_anthropic_api_key:         ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_sendgrid_api_key:           ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_stripe_price_starter:       ${{ secrets.STRIPE_PRICE_STARTER }}
          TF_VAR_stripe_price_professional:  ${{ secrets.STRIPE_PRICE_PROFESSIONAL }}
          TF_VAR_stripe_price_enterprise:    ${{ secrets.STRIPE_PRICE_ENTERPRISE }}
        run: terraform apply -auto-approve tfplan

      - name: Summary
        run: |
          echo "## Terraform Apply complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.resolve.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ── Terraform destroy (manual safety gate) ────────────────────────────────────
  destroy:
    name: Terraform DESTROY (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve, plan]
    if: needs.resolve.outputs.action == 'destroy'
    environment: ${{ needs.resolve.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Set environment secrets
        run: |
          if [ "${{ needs.resolve.outputs.environment }}" = "prod" ]; then
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}"             >> $GITHUB_ENV
            echo "TF_VAR_jwt_secret=${{ secrets.PROD_JWT_SECRET }}"               >> $GITHUB_ENV
            echo "TF_VAR_stripe_secret_key=${{ secrets.PROD_STRIPE_SECRET_KEY }}" >> $GITHUB_ENV
            echo "TF_VAR_stripe_webhook_secret=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_secret=${{ secrets.PROD_AUTH0_SECRET }}"                   >> $GITHUB_ENV
            echo "TF_VAR_auth0_issuer_base_url=${{ secrets.PROD_AUTH0_ISSUER_BASE_URL }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_id=${{ secrets.PROD_AUTH0_CLIENT_ID }}"             >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_secret=${{ secrets.PROD_AUTH0_CLIENT_SECRET }}"     >> $GITHUB_ENV
            echo "TF_VAR_auth0_audience=${{ secrets.PROD_AUTH0_AUDIENCE }}"               >> $GITHUB_ENV
          else
            echo "TF_VAR_db_password=${{ secrets.DEV_DB_PASSWORD }}"              >> $GITHUB_ENV
            echo "TF_VAR_jwt_secret=${{ secrets.DEV_JWT_SECRET }}"                >> $GITHUB_ENV
            echo "TF_VAR_stripe_secret_key=${{ secrets.DEV_STRIPE_SECRET_KEY }}"  >> $GITHUB_ENV
            echo "TF_VAR_stripe_webhook_secret=${{ secrets.DEV_STRIPE_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_secret=${{ secrets.DEV_AUTH0_SECRET }}"                   >> $GITHUB_ENV
            echo "TF_VAR_auth0_issuer_base_url=${{ secrets.DEV_AUTH0_ISSUER_BASE_URL }}" >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_id=${{ secrets.DEV_AUTH0_CLIENT_ID }}"             >> $GITHUB_ENV
            echo "TF_VAR_auth0_client_secret=${{ secrets.DEV_AUTH0_CLIENT_SECRET }}"     >> $GITHUB_ENV
            echo "TF_VAR_auth0_audience=${{ secrets.DEV_AUTH0_AUDIENCE }}"               >> $GITHUB_ENV
          fi

      - name: Terraform init
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        run: terraform init

      - name: Terraform destroy
        working-directory: ${{ needs.resolve.outputs.tf_dir }}
        env:
          TF_VAR_anthropic_api_key:         ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_sendgrid_api_key:           ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_stripe_price_starter:       ${{ secrets.STRIPE_PRICE_STARTER }}
          TF_VAR_stripe_price_professional:  ${{ secrets.STRIPE_PRICE_PROFESSIONAL }}
          TF_VAR_stripe_price_enterprise:    ${{ secrets.STRIPE_PRICE_ENTERPRISE }}
        run: terraform destroy -auto-approve

name: Deploy

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "terraform/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      image_tag:
        description: "Image tag to deploy (default: git SHA)"
        required: false

env:
  AWS_REGION: eu-west-2

permissions:
  id-token: write
  contents: read

jobs:
  # ── Build and push all three images ───────────────────────────────────────
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo ${{ github.sha }} | cut -c1-12)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set ECR base
        id: ecr
        run: echo "base=${{ steps.ecr-login.outputs.registry }}/neuroflow-${{ steps.env.outputs.env }}" >> "$GITHUB_OUTPUT"

      - name: Build backend
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ${{ steps.ecr.outputs.base }}/backend:${{ steps.tag.outputs.tag }} \
            -t ${{ steps.ecr.outputs.base }}/backend:latest \
            ./backend

      - name: Push backend
        run: |
          docker push ${{ steps.ecr.outputs.base }}/backend:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.ecr.outputs.base }}/backend:latest

      - name: Build frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="" \
            --build-arg NEXT_PUBLIC_PLATFORM_NAME="${{ secrets.NEXT_PUBLIC_PLATFORM_NAME || 'NeuroFlow' }}" \
            --build-arg NEXT_PUBLIC_PLATFORM_TAGLINE="NICE-aligned neurodevelopmental assessment for clinics" \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL="${{ secrets.SUPPORT_EMAIL }}" \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ${{ steps.ecr.outputs.base }}/frontend:${{ steps.tag.outputs.tag }} \
            -t ${{ steps.ecr.outputs.base }}/frontend:latest \
            ./frontend

      - name: Push frontend
        run: |
          docker push ${{ steps.ecr.outputs.base }}/frontend:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.ecr.outputs.base }}/frontend:latest

      - name: Build ai-workers
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.base }}/ai-workers:${{ steps.tag.outputs.tag }} \
            -t ${{ steps.ecr.outputs.base }}/ai-workers:latest \
            ./ai-workers

      - name: Push ai-workers
        run: |
          docker push ${{ steps.ecr.outputs.base }}/ai-workers:${{ steps.tag.outputs.tag }}
          docker push ${{ steps.ecr.outputs.base }}/ai-workers:latest

  # ── Deploy to dev (auto on push to master) ────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: build-push
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: dev

    env:
      ENV_NAME: dev
      CLUSTER: neuroflow-dev
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Run Alembic migrations
        run: |
          aws ecs run-task \
            --cluster ${{ env.CLUSTER }} \
            --task-definition neuroflow-dev-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws ec2 describe-subnets --filters Name=tag:Name,Values='neuroflow-dev-private-app*' --query 'Subnets[0].SubnetId' --output text)],securityGroups=[$(aws ec2 describe-security-groups --filters Name=group-name,Values='neuroflow-dev-backend-sg' --query 'SecurityGroups[0].GroupId' --output text)],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["sh","-c","python backend/scripts/ensure_db.py && alembic upgrade head"]}]}' \
            --count 1 || echo "Migration task skipped (infra may not be provisioned yet)"

      - name: Force new deployment — backend
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service neuroflow-${{ env.ENV_NAME }}-backend \
            --force-new-deployment

      - name: Force new deployment — frontend
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service neuroflow-${{ env.ENV_NAME }}-frontend \
            --force-new-deployment

      - name: Force new deployment — ai-workers
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service neuroflow-${{ env.ENV_NAME }}-ai-workers \
            --force-new-deployment

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services \
              neuroflow-${{ env.ENV_NAME }}-backend \
              neuroflow-${{ env.ENV_NAME }}-frontend
        timeout-minutes: 10

  # ── Deploy to staging / prod (manual only) ───────────────────────────────
  deploy-manual:
    name: Deploy → ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'dev'
    environment: ${{ github.event.inputs.environment }}

    env:
      ENV_NAME: ${{ github.event.inputs.environment }}
      CLUSTER: neuroflow-${{ github.event.inputs.environment }}
      IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Force new deployment — backend
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service neuroflow-${{ env.ENV_NAME }}-backend \
            --force-new-deployment

      - name: Force new deployment — frontend
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service neuroflow-${{ env.ENV_NAME }}-frontend \
            --force-new-deployment

      - name: Force new deployment — ai-workers
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service neuroflow-${{ env.ENV_NAME }}-ai-workers \
            --force-new-deployment

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services \
              neuroflow-${{ env.ENV_NAME }}-backend \
              neuroflow-${{ env.ENV_NAME }}-frontend
        timeout-minutes: 15

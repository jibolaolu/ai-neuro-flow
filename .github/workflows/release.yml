name: Release

# Triggered when a version tag is pushed: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so release notes can include all commits

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NeuroFlow ${{ github.ref_name }}"
          generate_release_notes: true   # auto-generates changelog from commits
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # e.g. v1.1.0-beta → pre-release

  # ── Auto-deploy to prod on release ──────────────────────────────────────────
  deploy:
    name: Deploy release to prod
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image_tag: ${{ github.ref_name }}   # use the version tag (e.g. v1.0.0) as image tag
    secrets: inherit
